name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify committed results (strict)
        run: pnpm -s staybench verify results
      - name: Build the site
        run: pnpm site:build
      - name: Check the site has a page per submission
        run: |
          test -f site/dist/index.html
          test -f site/dist/scenarios/index.html
          test -f site/dist/runs/staybench/scripted-good/index.html
          test -f site/dist/runs/staybench/scripted-bad/index.html
