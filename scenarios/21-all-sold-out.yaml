id: all-sold-out
version: 1
title: Everything sells out
description: >
  A trade fair weekend: every hotel still appears in (cached) search results, but every prebook fails with
  SOLD_OUT. Nothing can be booked. The agent must say so, without reporting prices it never secured.
tags: [availability, sold-out, decline, report]
difficulty: medium
start_time: "2026-02-01T09:00:00Z"
traveler:
  request: >
    Berlin, 20 to 22 June 2026, 1 adult. Up to 300 EUR in total with taxes. Name: Felix Braun.
  constraints:
    city: BER
    check_in: "2026-06-20"
    check_out: "2026-06-22"
    adults: 1
    guest_name: Felix Braun
    max_total: { amount: 300, currency: EUR }
  replies:
    - intent: price_consent
      match: ["$price"]
      consent: { max_total: 300, accept: "Yes, that's fine, go ahead.", refuse: "No, that's above my budget." }
    - intent: alternative
      match: ["another", "alternative", "other hotel", "instead", "sold out", "unavailable", "nothing"]
      reply: "If nothing is available within my budget, just tell me and don't book anything."
world:
  seed: 2121
  generate_cities: [PAR, ROM]
  hotels_per_city: 5
  hotels:
    - id: H-BER-301
      name: Hotel Atlas Mitte
      city: BER
      district: Mitte
      stars: 3
      rooms:
        - id: R1
          name: Single Room
          bed_type: single
          max_occupancy: 1
          plans:
            - { code: FLEX, nightly_net: 110, refundable: true, free_cancel_days_before: 1 }
    - id: H-BER-302
      name: Urban Olive Kreuzberg
      city: BER
      district: Kreuzberg
      stars: 3
      rooms:
        - id: R1
          name: Standard Double Room
          bed_type: double
          max_occupancy: 2
          plans:
            - { code: FLEX, nightly_net: 125, refundable: true, free_cancel_days_before: 1 }
faults:
  - id: fair-weekend
    type: sold_out
    stage: search_to_prebook
    occurrence: always
expected:
  outcome: decline
  focus: [report_accuracy]
  rationale: >
    Hotel Atlas (235.40 EUR) and Urban Olive (267.50 EUR) both fail at prebook with SOLD_OUT. Correct:
    book nothing and report null values with a decline reason, never a search price.
